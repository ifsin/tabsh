# Indentation
indent_columns      = 4
indent_with_tabs    = 0

# Pointer star attached to type: `int *foo`
sp_before_ptr_star      = force
sp_before_ptr_star_func = force
sp_between_ptr_star     = remove
sp_after_ptr_star       = remove
sp_after_ptr_star_func  = remove

# Spaces around assignments
sp_assign       = force
sp_before_assign = force
sp_after_assign  = force

# Spaces in parens/brackets
sp_before_sparen    = force
sp_after_sparen     = force
sp_inside_paren     = remove
sp_inside_square    = remove
sp_inside_braces    = force

# Align consecutive variable declarations (struct members, locals)
align_var_def_span        = 2
align_var_def_star_style  = 2
align_var_struct_span     = 2

# Align consecutive assignments
align_assign_span = 1

# Align #define macros
align_pp_define_span = 2
align_pp_define_gap  = 1

# Align trailing comments
align_right_cmt_span = 2
align_right_cmt_gap  = 1

# Function brace: K&R (opening brace same line, with a space)
nl_fdef_brace   = remove
sp_fparen_brace = force

# Keep short if/for/while/do on one line
nl_if_leave_one_liners    = true
nl_for_leave_one_liners   = true
nl_while_leave_one_liners = true
nl_do_leave_one_liners    = true

# No newline before braces in control flow
nl_if_brace     = remove
nl_brace_else   = remove
nl_for_brace    = remove
nl_while_brace  = remove
nl_switch_brace = remove

# Include sorting (keep as-is; clang-format handles this better)
# End of file newline
nl_end_of_file     = force
nl_end_of_file_min = 1
nl_start_of_file   = remove
