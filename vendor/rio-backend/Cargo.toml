[package]
name = "rio-backend"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
keywords.workspace = true
repository = "https://github.com/raphamorim/rio"
documentation = "https://github.com/raphamorim/rio#readme"
description = "Backend infrastructure for Rio terminal"

[lib]
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
tracing = { workspace = true }
base64 = { workspace = true }
memchr = { version = "2.7.4", default-features = false }
bitflags = { workspace = true }
bytemuck = { workspace = true }
rustc-hash = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
rio-grapheme-width = { workspace = true }
unicode-width = { workspace = true }
url = { workspace = true }
regex-automata = "0.4.9"
cursor-icon = { version = "1.1.0", default-features = false }
smallvec = { version = "1.13.2", default-features = false }
parking_lot = { workspace = true }
lazy_static = { workspace = true }
flate2 = { workspace = true }
sugarloaf = { workspace = true }
image_rs = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
toml = "0.9.2"
raw-window-handle = { workspace = true }
copypasta = { version = "0.10.2", default-features = false }
dirs = "6.0.0"
libc = { workspace = true }
wgpu = { workspace = true, optional = true }
rio-window = { workspace = true }
simdutf = { workspace = true }
onig = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60.2", features = ["Win32_System_Memory", "Win32_Foundation"] }

[features]
default = ["wayland", "x11"]
x11 = [
    "copypasta/x11"
]
wayland = [
    "copypasta/wayland",
]
wgpu = ["dep:wgpu", "sugarloaf/wgpu"]
