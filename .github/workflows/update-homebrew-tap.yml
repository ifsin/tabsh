name: Update Homebrew Tap

on:
  release:
    types: [published]

jobs:
  update-tap:
    runs-on: ubuntu-latest
    steps:
      - name: Get release info
        id: release
        run: |
          TAG_NAME="${{ github.event.release.tag_name }}"
          VERSION="${TAG_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tarball_url=https://github.com/${{ github.repository }}/archive/refs/tags/${TAG_NAME}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Compute tarball SHA256
        id: sha
        run: |
          curl -sL "${{ steps.release.outputs.tarball_url }}" | sha256sum | awk '{print $1}' > sha256.txt
          echo "sha=$(cat sha256.txt)" >> "$GITHUB_OUTPUT"

      - name: Checkout homebrew-tap
        uses: actions/checkout@v4
        with:
          repository: ifsin/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update formula
        run: |
          FORMULA="homebrew-tap/Formula/tabsh.rb"
          VERSION="${{ steps.release.outputs.version }}"
          SHA256="${{ steps.sha.outputs.sha }}"
          URL="${{ steps.release.outputs.tarball_url }}"

          sed -i \
            -e "s|url \"https://github.com/[^/]*/[^/]*/archive/refs/tags/.*.tar.gz\"|url \"${URL}\"|" \
            -e "s|sha256 \"[^\"]*\"|sha256 \"${SHA256}\"|" \
            "$FORMULA"

          echo "Updated formula:"
          grep -E "url|sha256|version" "$FORMULA" | head -5

      - name: Commit and push
        run: |
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/tabsh.rb
          git diff --cached --quiet || git commit -m "tabsh ${{ steps.release.outputs.version }}"
          git push
